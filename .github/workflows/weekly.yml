name: Weekly citation run

# Runs the collector on a schedule, commits the updated DB + regenerated
# dashboard back to the repo. Netlify (connected to this repo, publish dir
# "output") auto-deploys on that commit.
#
# NOTE: this workflow does NOT trigger on push, so its own commit can't
# re-trigger it — no infinite loop, and no [skip ci] needed.
on:
  schedule:
    # 11:00 UTC every Monday ≈ 6:00 AM Central (varies ±1h with US DST).
    - cron: "0 11 * * 1"
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write   # allow the job to commit the updated DB + dashboard

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect responses and build dashboard
        env:
          # To add an engine: store its key as a repo secret, add the matching
          # line here, and append the engine name to the --engines list below.
          #   ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          #   OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          #   PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python src/runner.py --engines gemini
          python src/dashboard.py

      - name: Commit updated data and dashboard
        run: |
          git config user.name "citation-tracker-bot"
          git config user.email "actions@github.com"
          git add db/citations.db output/dashboard.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly citation run: $(date -u +%Y-%m-%d)"
            git push
          fi
